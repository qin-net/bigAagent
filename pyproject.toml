[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightagent"
version = "0.1.0"
description = "A lightweight, isolated agent runtime for InsightAgent"
requires-python = ">=3.9"
dependencies = [
  "openai",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
]
akshare = [
  "akshare",
  "pandas",
]
docs = [
  "pymupdf",
]
board = [
  "akshare",
  "fastapi",
  "uvicorn",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insightagent = ["fixtures/*.json"]
insightboard = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: calls a real external API",
]
